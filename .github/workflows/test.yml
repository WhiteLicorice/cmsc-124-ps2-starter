name: ps2-checks
on: [push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - run: chmod +x run check.sh
        shell: bash
      - run: ./run P10
        shell: bash
      - run: ./check.sh
        shell: bash
